PointfootCfg:
  loop_frequency: 200
  joint_names:
    - "abad_L_Joint"
    - "hip_L_Joint"
    - "knee_L_Joint"
    - "wheel_L_Joint"
    - "abad_R_Joint"
    - "hip_R_Joint"
    - "knee_R_Joint"
    - "wheel_R_Joint"

  init_state:
    # target angles [rad] when action = 0.0
    default_joint_angle:
      abad_L_Joint: 0.0
      hip_L_Joint: 0.0
      knee_L_Joint: 0.0
      wheel_L_Joint: 0.0

      abad_R_Joint: 0.0
      hip_R_Joint: 0.0
      knee_R_Joint: 0.0
      wheel_R_Joint: 0.0

  control:
    # PD Drive parameters:
    stiffness: 42.0
    damping: 2.5
    wheel_joint_damping: 0.8
    wheel_joint_torque_limit: 40
    action_scale_pos: 0.5
    action_scale_vel: 5.0
    decimation: 4
    user_torque_limit: 80

  normalization:
    clip_scales:
      clip_observations: 100.
      clip_actions: 100.
    obs_scales:
      ang_vel: 0.25
      dof_pos: 1.0
      dof_vel: 0.05

  size:
    actions_size: 8
    observations_size: 34
    commands_size: 6
    obs_history_length: 20
    jointpos_idxs: [0, 1, 2, 4, 5, 6]

  stand_mode:
    stand_duration: 1.0

  imu_orientation_offset:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
